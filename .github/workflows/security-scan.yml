name: "Security Vulnerability Scan"

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"

  pull_request:
    branches:
      - main

  schedule:
    - cron: "0 7 * * *"

  workflow_dispatch:
    inputs:
      target_url:
        description: "Target URL to scan (default: http://localhost:3000)"
        required: false
        default: "http://localhost:3000"

env:
  PYTHON_VERSION: "3.11"
  REPORTS_DIR: "reports"

jobs:
  security-scan:
    name: "Security Vulnerability Analysis"

    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write

    timeout-minutes: 60

    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4

      - name: "Setup Python ${{ env.PYTHON_VERSION }}"
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: "Install Python dependencies"
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: "Verify Docker installation"
        run: |
          docker --version
          docker compose version

      - name: "Run regression tests"
        run: python -m unittest discover -s tests -v

      - name: "Run assessment"
        env:
          TARGET_URL: ${{ inputs.target_url }}
        run: |
          if [ -n "$TARGET_URL" ] && [ "$TARGET_URL" != "http://localhost:3000" ]; then
            python main.py --target "$TARGET_URL" --no-browser
          else
            python main.py --juice-shop --no-browser
          fi

      - name: "Export findings summary"
        run: |
          python - << 'EOF'
          import os
          from pathlib import Path
          from parsers.nmap_parser import parse_nmap
          from parsers.trivy_parser import parse_trivy
          from parsers.zap_parser import parse_zap

          report_dir = max(Path("reports").glob("*/dashboard.html"), key=lambda path: path.stat().st_mtime).parent
          trivy = parse_trivy(report_dir / "trivy.json")["counts"]
          zap = parse_zap(report_dir / "zap.json")["counts"]
          nmap = parse_nmap(report_dir / "nmap.txt")["count"]
          with open(os.environ["GITHUB_ENV"], "a") as stream:
              stream.write(f"CRITICAL_CVES={trivy.get('CRITICAL', 0)}\n")
              stream.write(f"HIGH_CVES={trivy.get('HIGH', 0)}\n")
              stream.write(f"ZAP_HIGH={zap.get('High', 0)}\n")
              stream.write(f"OPEN_PORTS={nmap}\n")
          EOF

      - name: "💬 Comment security summary on PR"
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const critical = process.env.CRITICAL_CVES || '0';
            const high     = process.env.HIGH_CVES || '0';
            const zapHigh  = process.env.ZAP_HIGH || '0';
            const ports    = process.env.OPEN_PORTS || '0';

            const risk = parseInt(critical) > 0 ? '🔴' :
                              parseInt(high) > 5 ? '🟠' :
                              parseInt(zapHigh) > 0 ? '🟡' : '🟢';

            const body = `## ${risk} Security Scan Results

            | Metric | Count |
            |--------|-------|
            | 🔴 Critical CVEs | **${critical}** |
            | 🟠 High CVEs | **${high}** |
            | 🟡 Web Alerts (High) | **${zapHigh}** |
            | 🌐 Open Ports | **${ports}** |

            > Full dashboard available in the **Artifacts** section of this workflow run.
            > [View workflow run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})

            *Generated by Vulnerability Analysis · Nmap + Trivy + OWASP ZAP*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

      - name: "Upload security reports as artifacts"
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: "security-reports-${{ github.run_number }}"
          path: |
            reports/*/dashboard.html
            reports/*/nmap.txt
            reports/*/trivy.json
            reports/*/zap.json
            reports/*/zap.html
          retention-days: 30

      - name: "Cleanup Docker containers"
        if: always()
        run: |
          docker compose down --remove-orphans || true
          echo "Cleanup completed"
